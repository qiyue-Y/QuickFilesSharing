<!doctype html>
<html lang="zh-CN" data-view="login">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <title>QFR - Quick Files Relay</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f5f7f4;
            --paper-soft: #eef2ef;
            --surface: rgba(251, 252, 250, .88);
            --ink: #252b28;
            --muted: #66716b;
            --faint: #98a29c;
            --line: rgba(66, 82, 73, .15);
            --line-strong: rgba(66, 82, 73, .28);
            --accent: #547a86;
            --accent-dark: #365c67;
            --accent-soft: #dce8e9;
            --success: #466e59;
            --danger: #9b514d;
            --shadow: 0 24px 60px rgba(50, 68, 59, .09);
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-width: 320px;
            min-height: 100%;
            background: var(--paper);
            color: var(--ink);
        }

        body {
            min-height: 100dvh;
            overflow-x: hidden;
            font-family: "Segoe UI Variable", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button,
        input,
        textarea { font: inherit; }

        button { color: inherit; }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .page-shell {
            position: relative;
            min-height: 100dvh;
            isolation: isolate;
            overflow: hidden;
        }

        .page-shell::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -3;
            pointer-events: none;
            background:
                linear-gradient(105deg, rgba(255,255,255,.82), rgba(255,255,255,0) 52%),
                var(--paper);
        }

        .brand {
            position: fixed;
            top: clamp(28px, 5vw, 68px);
            left: clamp(24px, 6vw, 96px);
            z-index: 20;
            display: flex;
            align-items: flex-start;
            gap: 18px;
            text-decoration: none;
            transition: top .9s var(--ease), left .9s var(--ease), transform .9s var(--ease);
        }

        .brand-mark {
            font-family: Baskerville, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
            font-size: clamp(72px, 10vw, 148px);
            font-weight: 400;
            line-height: .78;
            letter-spacing: 0;
            color: var(--ink);
            transition: font-size .9s var(--ease), color .45s ease;
        }

        .brand-expansion {
            width: 128px;
            margin-top: 5px;
            color: var(--muted);
            font-family: Baskerville, "Iowan Old Style", Georgia, serif;
            font-size: 13px;
            font-style: italic;
            line-height: 1.2;
            transition: opacity .4s ease, transform .6s var(--ease);
        }

        .brand-expansion span { display: block; }

        .artwork {
            position: fixed;
            z-index: -1;
            right: clamp(-64px, 2vw, 34px);
            bottom: -3vh;
            width: min(47vw, 650px);
            aspect-ratio: 500 / 621;
            pointer-events: none;
            filter: saturate(.78) contrast(.97);
            transform-origin: 70% 75%;
            transition: width 1s var(--ease), right 1s var(--ease), bottom 1s var(--ease), opacity .55s ease, transform 1s var(--ease);
        }

        .artwork::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, var(--paper) 0%, transparent 13%, transparent 92%, var(--paper) 100%);
            opacity: .2;
        }

        .paint-layer {
            position: absolute;
            inset: 0;
            background-image: url("assets/monet-woman-with-parasol.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .paint-layer.umbrella {
            clip-path: polygon(19% 20%, 25% 12%, 38% 6%, 52% 3%, 67% 5%, 79% 13%, 84% 21%, 76% 28%, 62% 31%, 43% 29%, 28% 27%);
        }

        .paint-layer.figure {
            clip-path: polygon(52% 22%, 61% 19%, 69% 23%, 72% 31%, 67% 37%, 69% 44%, 74% 51%, 73% 59%, 78% 70%, 77% 82%, 70% 89%, 57% 85%, 45% 78%, 34% 71%, 40% 62%, 45% 54%, 44% 44%, 48% 36%);
        }

        .paint-layer.handle {
            clip-path: polygon(50% 24%, 54% 24%, 55% 53%, 50% 54%);
        }

        .paint-haze {
            position: absolute;
            left: 26%;
            right: 8%;
            bottom: 6%;
            height: 23%;
            background: url("assets/monet-woman-with-parasol.jpg") center bottom / 100% auto no-repeat;
            filter: blur(14px);
            opacity: .17;
            mask-image: linear-gradient(to bottom, transparent, #000 30%, transparent 86%);
        }

        .art-credit {
            position: fixed;
            right: 26px;
            bottom: 20px;
            z-index: 15;
            color: rgba(51, 62, 56, .56);
            font-size: 10px;
            text-decoration: none;
            transition: opacity .4s ease;
        }

        .art-credit:hover { color: var(--accent-dark); }

        .login-view {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: minmax(300px, 600px) 1fr;
            align-items: center;
            min-height: 100dvh;
            padding: 180px clamp(24px, 6vw, 96px) 70px;
            transition: opacity .42s ease, transform .8s var(--ease), visibility 0s linear;
        }

        .login-copy {
            width: min(100%, 570px);
            padding-top: clamp(70px, 10vh, 120px);
        }

        .login-copy h1 {
            max-width: 520px;
            margin: 0 0 20px;
            font-family: Baskerville, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
            font-size: clamp(40px, 5vw, 72px);
            font-weight: 400;
            line-height: 1.04;
            letter-spacing: 0;
        }

        .login-copy h1 em {
            color: var(--accent-dark);
            font-weight: 400;
        }

        .login-copy > p {
            max-width: 390px;
            margin: 0 0 46px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        .login-form {
            display: grid;
            grid-template-columns: minmax(0, 310px) auto;
            align-items: end;
            gap: 14px;
            width: min(100%, 460px);
        }

        .field { display: grid; gap: 9px; }

        .field label {
            color: var(--muted);
            font-size: 12px;
        }

        .line-input {
            width: 100%;
            height: 52px;
            padding: 0 2px;
            border: 0;
            border-bottom: 1px solid var(--line-strong);
            border-radius: 0;
            outline: 0;
            background: transparent;
            color: var(--ink);
            font-size: 17px;
            transition: border-color .3s ease;
        }

        .line-input::placeholder { color: var(--faint); }
        .line-input:focus { border-bottom-color: var(--accent-dark); }

        .primary-button,
        .soft-button,
        .text-button,
        .icon-button {
            border: 0;
            cursor: pointer;
            transition: transform .25s var(--ease), background .25s ease, color .25s ease, border-color .25s ease;
        }

        .primary-button:active,
        .soft-button:active,
        .icon-button:active { transform: scale(.98); }

        .primary-button {
            min-width: 116px;
            height: 52px;
            padding: 0 24px;
            border-radius: 4px;
            background: var(--accent-dark);
            color: #f8fbfa;
            font-weight: 600;
        }

        .primary-button:hover { background: #294c56; }

        .remember-row {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 9px;
            width: max-content;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .remember-row input {
            width: 15px;
            height: 15px;
            accent-color: var(--accent-dark);
        }

        .workspace-view {
            position: relative;
            z-index: 8;
            min-height: 100dvh;
            padding: 116px clamp(20px, 4vw, 68px) 64px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(34px);
            transition: opacity .55s .18s ease, transform .9s .08s var(--ease), visibility 0s .9s linear;
        }

        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 42px;
            margin-bottom: 28px;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 13px;
        }

        .identity strong {
            color: var(--ink);
            font-weight: 600;
        }

        .text-button {
            padding: 7px 0;
            background: transparent;
            color: var(--muted);
            border-bottom: 1px solid var(--line-strong);
            font-size: 12px;
        }

        .text-button:hover { color: var(--accent-dark); border-color: var(--accent-dark); }

        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(340px, .75fr) minmax(220px, .38fr);
            gap: clamp(18px, 2.4vw, 38px);
            align-items: start;
            max-width: 1500px;
            margin: 0 auto;
        }

        .tool-panel {
            min-height: 590px;
            padding: clamp(24px, 3vw, 42px);
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .panel-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 26px;
        }

        .panel-heading h2 {
            margin: 0;
            font-family: Baskerville, "Iowan Old Style", Georgia, serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .panel-heading span {
            color: var(--muted);
            font-size: 11px;
        }

        .clipboard-input {
            display: block;
            width: 100%;
            min-height: 390px;
            padding: 24px 0;
            border: 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            outline: 0;
            resize: vertical;
            background: transparent;
            color: var(--ink);
            font-family: "Cascadia Code", Consolas, "Microsoft YaHei UI", monospace;
            font-size: 14px;
            line-height: 1.75;
        }

        .clipboard-input::placeholder { color: var(--faint); }

        .clipboard-input:focus {
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
        }

        .soft-button {
            min-height: 38px;
            padding: 0 15px;
            border: 1px solid var(--line-strong);
            border-radius: 4px;
            background: rgba(255,255,255,.52);
            color: var(--ink);
            font-size: 12px;
        }

        .soft-button:hover { border-color: var(--accent); color: var(--accent-dark); }

        .soft-button.main {
            border-color: var(--accent-dark);
            background: var(--accent-dark);
            color: #fff;
        }

        .soft-button.danger:hover { border-color: var(--danger); color: var(--danger); }

        .status-text {
            min-height: 20px;
            margin-left: auto;
            color: var(--success);
            font-size: 12px;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .25s ease, transform .35s var(--ease);
        }

        .status-text.visible { opacity: 1; transform: translateY(0); }

        .drop-zone {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 172px;
            padding: 24px;
            border: 1px dashed var(--line-strong);
            border-radius: 5px;
            background: rgba(239, 244, 241, .55);
            text-align: center;
            transition: background .3s ease, border-color .3s ease, transform .35s var(--ease);
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-2px);
        }

        .drop-zone input { display: none; }

        .upload-symbol {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            margin: 0 auto 14px;
            border: 1px solid var(--line-strong);
            border-radius: 50%;
            color: var(--accent-dark);
            font-family: Georgia, serif;
            font-size: 22px;
        }

        .drop-zone label {
            color: var(--ink);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .drop-zone p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
        }

        .progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            overflow: hidden;
            background: transparent;
        }

        .progress span {
            display: block;
            width: 0;
            height: 100%;
            background: var(--accent);
            transition: width .35s ease;
        }

        .storage-line {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 20px 0 8px;
            color: var(--muted);
            font-size: 11px;
        }

        .file-list { margin-top: 6px; }

        .file-row {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 68px;
            border-bottom: 1px solid var(--line);
            animation: fileIn .5s var(--ease) both;
        }

        .file-glyph {
            display: grid;
            place-items: center;
            width: 30px;
            height: 36px;
            border: 1px solid var(--line-strong);
            border-radius: 3px;
            color: var(--accent-dark);
            font-family: Georgia, serif;
            font-size: 10px;
        }

        .file-meta { min-width: 0; }

        .file-name {
            overflow: hidden;
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            margin-top: 4px;
            color: var(--muted);
            font-size: 10px;
        }

        .file-actions {
            display: flex;
            gap: 4px;
            opacity: .35;
            transition: opacity .2s ease;
        }

        .file-row:hover .file-actions,
        .file-actions:focus-within { opacity: 1; }

        .icon-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 3px;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
        }

        .icon-button:hover { background: var(--paper-soft); color: var(--accent-dark); }
        .icon-button.delete:hover { color: var(--danger); }

        .verify-details {
            margin-top: 22px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
        }

        .verify-details summary {
            width: max-content;
            color: var(--accent-dark);
            cursor: pointer;
        }

        .art-spacer {
            min-height: 590px;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            z-index: 30;
            max-width: calc(100vw - 40px);
            padding: 11px 16px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: rgba(36, 45, 41, .94);
            color: #f7faf8;
            box-shadow: var(--shadow);
            font-size: 12px;
            opacity: 0;
            transform: translate(-50%, 14px);
            visibility: hidden;
            transition: opacity .25s ease, transform .4s var(--ease), visibility 0s .45s;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
            visibility: visible;
            transition-delay: 0s;
        }

        html[data-view="workspace"] .brand {
            top: 38px;
            left: clamp(20px, 4vw, 68px);
        }

        html[data-view="workspace"] .brand-mark { font-size: 50px; }

        html[data-view="workspace"] .brand-expansion {
            opacity: 0;
            transform: translateX(-12px);
            pointer-events: none;
        }

        html[data-view="workspace"] .login-view {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-24px);
            transition: opacity .34s ease, transform .8s var(--ease), visibility 0s .5s linear;
        }

        html[data-view="workspace"] .workspace-view {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity .55s .25s ease, transform .9s .1s var(--ease), visibility 0s linear;
        }

        html[data-view="workspace"] .artwork {
            right: -24px;
            bottom: -4vh;
            width: min(29vw, 430px);
            opacity: .84;
            transform: translateX(2vw) scale(.98);
        }

        html[data-view="workspace"] .art-credit { opacity: .58; }

        @keyframes fileIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1120px) {
            .workspace-grid { grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); }
            .art-spacer { display: none; }
            html[data-view="workspace"] .artwork { opacity: .12; }
        }

        @media (max-width: 780px) {
            .page-shell { overflow: visible; }

            .brand,
            html[data-view="workspace"] .brand {
                position: absolute;
                top: 28px;
                left: 20px;
            }

            .brand-mark,
            html[data-view="workspace"] .brand-mark { font-size: 56px; }

            .brand-expansion {
                width: 94px;
                font-size: 10px;
            }

            .login-view {
                display: block;
                min-height: 100dvh;
                padding: 130px 20px 48px;
            }

            .login-copy {
                position: relative;
                z-index: 2;
                width: 100%;
                padding-top: 29vh;
            }

            .login-copy h1 { max-width: 360px; font-size: clamp(38px, 12vw, 58px); }
            .login-copy > p { max-width: 320px; margin-bottom: 34px; }
            .login-form { grid-template-columns: 1fr auto; }
            .primary-button { min-width: 96px; padding: 0 16px; }

            .artwork {
                position: absolute;
                top: 44px;
                right: -34px;
                bottom: auto;
                width: min(72vw, 390px);
                opacity: .82;
            }

            .workspace-view { padding: 104px 16px 72px; }
            .workspace-header { margin-bottom: 20px; }
            .workspace-grid { grid-template-columns: 1fr; gap: 16px; }
            .tool-panel { min-height: auto; padding: 24px 20px; }
            .clipboard-input { min-height: 300px; }
            .file-panel { margin-bottom: 180px; }

            html[data-view="workspace"] .artwork {
                position: absolute;
                top: auto;
                right: -28px;
                bottom: 4px;
                width: min(72vw, 360px);
                opacity: .32;
                transform: none;
            }

            .art-credit {
                position: absolute;
                right: 16px;
                bottom: 12px;
            }

            .panel-actions { flex-wrap: wrap; }
            .status-text { flex-basis: 100%; margin-left: 0; }
        }

        @media (max-width: 460px) {
            .login-form { grid-template-columns: 1fr; }
            .primary-button { width: 100%; }
            .remember-row { grid-column: 1; }
            .identity { gap: 10px; }
            .panel-heading { align-items: flex-start; flex-direction: column; gap: 6px; }
            .file-row { grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                transition-delay: 0s !important;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <a class="brand" href="#" aria-label="QFR 首页" id="brandLink">
            <span class="brand-mark">QFR</span>
            <span class="brand-expansion" aria-hidden="true">
                <span>quick</span>
                <span>files</span>
                <span>relay</span>
            </span>
        </a>

        <div class="artwork" aria-hidden="true">
            <div class="paint-layer umbrella"></div>
            <div class="paint-layer handle"></div>
            <div class="paint-layer figure"></div>
            <div class="paint-haze"></div>
        </div>

        <a class="art-credit" href="https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Woman_with_a_Parasol_-_Madame_Monet_and_Her_Son_-_Google_Art_Project.jpg" target="_blank" rel="noreferrer">
            Claude Monet, 1875（公版）
        </a>

        <section class="login-view" id="loginView">
            <div class="login-copy">
                <h1>让片段与文件，<br><em>轻轻抵达。</em></h1>
                <p>在可信局域网内共享剪切板和大文件。输入名字，进入属于你的临时空间。</p>

                <form class="login-form" id="loginForm">
                    <div class="field">
                        <label for="username">用户名</label>
                        <input class="line-input" id="username" name="username" autocomplete="username" placeholder="例如 用户">
                    </div>
                    <button class="primary-button" type="submit">进入空间</button>
                    <label class="remember-row">
                        <input id="rememberUser" type="checkbox">
                        <span>在这台设备上记住我</span>
                    </label>
                </form>
            </div>
        </section>

        <section class="workspace-view" id="workspaceView" aria-hidden="true">
            <header class="workspace-header">
                <div class="identity">
                    <span>当前空间</span>
                    <strong id="currentUser">default</strong>
                    <button class="text-button" type="button" id="logoutButton">退出</button>
                </div>
            </header>

            <div class="workspace-grid">
                <section class="tool-panel clipboard-panel" aria-labelledby="clipboardTitle">
                    <div class="panel-heading">
                        <h2 id="clipboardTitle">剪切板</h2>
                        <span id="editedTime">刚刚同步</span>
                    </div>
                    <textarea class="clipboard-input" id="clipboardInput" placeholder="在这里写下需要传递的文字……">会议室投屏地址：
http://198.51.100.7:5000

今晚交付的素材已放在文件区。</textarea>
                    <div class="panel-actions">
                        <button class="soft-button main" type="button" id="saveButton">保存</button>
                        <button class="soft-button" type="button" id="refreshButton">刷新</button>
                        <button class="soft-button danger" type="button" id="clearButton">清空</button>
                        <span class="status-text" id="clipboardStatus" role="status">已保存</span>
                    </div>
                </section>

                <section class="tool-panel file-panel" aria-labelledby="fileTitle">
                    <div class="panel-heading">
                        <h2 id="fileTitle">文件</h2>
                        <span>最多 30 GB</span>
                    </div>

                    <div class="drop-zone" id="dropZone">
                        <input id="fileInput" type="file" multiple>
                        <div>
                            <span class="upload-symbol">↑</span>
                            <label for="fileInput">选择文件</label>
                            <p>也可以把文件拖到这里</p>
                        </div>
                        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
                    </div>

                    <div class="storage-line">
                        <span>服务器剩余空间</span>
                        <span>186.4 GB / 476.8 GB</span>
                    </div>

                    <div class="file-list" id="fileList" aria-live="polite">
                        <div class="file-row">
                            <span class="file-glyph">PDF</span>
                            <div class="file-meta">
                                <div class="file-name">QFR-interface-notes.pdf</div>
                                <div class="file-size">4.8 MB</div>
                            </div>
                            <div class="file-actions">
                                <button class="icon-button" type="button" title="下载" aria-label="下载 QFR-interface-notes.pdf">↓</button>
                                <button class="icon-button delete" type="button" title="删除" aria-label="删除 QFR-interface-notes.pdf">×</button>
                            </div>
                        </div>
                        <div class="file-row">
                            <span class="file-glyph">ZIP</span>
                            <div class="file-meta">
                                <div class="file-name">deliverables-0920.zip</div>
                                <div class="file-size">1.3 GB</div>
                            </div>
                            <div class="file-actions">
                                <button class="icon-button" type="button" title="下载" aria-label="下载 deliverables-0920.zip">↓</button>
                                <button class="icon-button delete" type="button" title="删除" aria-label="删除 deliverables-0920.zip">×</button>
                            </div>
                        </div>
                    </div>

                    <details class="verify-details">
                        <summary>下载后校验文件完整性</summary>
                        <p>点击文件后的下载按钮可查看 SHA-256 和对应系统的校验命令。</p>
                    </details>
                </section>

                <div class="art-spacer" aria-hidden="true"></div>
            </div>
        </section>

        <div class="toast" id="toast" role="status"></div>
    </main>

    <script>
        const root = document.documentElement;
        const loginForm = document.getElementById('loginForm');
        const loginView = document.getElementById('loginView');
        const workspaceView = document.getElementById('workspaceView');
        const usernameInput = document.getElementById('username');
        const rememberUser = document.getElementById('rememberUser');
        const currentUser = document.getElementById('currentUser');
        const clipboardInput = document.getElementById('clipboardInput');
        const clipboardStatus = document.getElementById('clipboardStatus');
        const editedTime = document.getElementById('editedTime');
        const toast = document.getElementById('toast');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const progressFill = document.getElementById('progressFill');
        const STORAGE_USER = 'qfr_demo_user';
        const STORAGE_CLIPBOARD = 'qfr_demo_clipboard';
        let toastTimer = null;
        let statusTimer = null;

        function setView(view) {
            root.dataset.view = view;
            const inWorkspace = view === 'workspace';
            loginView.setAttribute('aria-hidden', String(inWorkspace));
            workspaceView.setAttribute('aria-hidden', String(!inWorkspace));
            loginView.inert = inWorkspace;
            workspaceView.inert = !inWorkspace;
        }

        function showToast(message) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('visible');
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
        }

        function showClipboardStatus(message) {
            clearTimeout(statusTimer);
            clipboardStatus.textContent = message;
            clipboardStatus.classList.add('visible');
            statusTimer = setTimeout(() => clipboardStatus.classList.remove('visible'), 1800);
        }

        function enterWorkspace(name) {
            const normalized = name.trim() || 'default';
            currentUser.textContent = normalized;
            if (rememberUser.checked) localStorage.setItem(STORAGE_USER, normalized);
            else localStorage.removeItem(STORAGE_USER);
            const savedClipboard = localStorage.getItem(`${STORAGE_CLIPBOARD}:${normalized}`);
            if (savedClipboard !== null) clipboardInput.value = savedClipboard;
            setView('workspace');
        }

        loginForm.addEventListener('submit', event => {
            event.preventDefault();
            enterWorkspace(usernameInput.value);
        });

        document.getElementById('logoutButton').addEventListener('click', () => {
            setView('login');
            usernameInput.value = rememberUser.checked ? currentUser.textContent : '';
            setTimeout(() => usernameInput.focus(), 500);
        });

        document.getElementById('brandLink').addEventListener('click', event => {
            event.preventDefault();
            if (root.dataset.view === 'workspace') document.getElementById('logoutButton').click();
        });

        document.getElementById('saveButton').addEventListener('click', () => {
            localStorage.setItem(`${STORAGE_CLIPBOARD}:${currentUser.textContent}`, clipboardInput.value);
            editedTime.textContent = '刚刚保存';
            showClipboardStatus('已保存');
        });

        document.getElementById('refreshButton').addEventListener('click', () => {
            const saved = localStorage.getItem(`${STORAGE_CLIPBOARD}:${currentUser.textContent}`);
            if (saved !== null) clipboardInput.value = saved;
            editedTime.textContent = '刚刚同步';
            showClipboardStatus('已刷新');
        });

        document.getElementById('clearButton').addEventListener('click', () => {
            clipboardInput.value = '';
            clipboardInput.focus();
            showClipboardStatus('已清空');
        });

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return `${(bytes / Math.pow(1024, index)).toFixed(index > 1 ? 1 : 0)} ${units[index]}`;
        }

        function extensionLabel(name) {
            const extension = name.includes('.') ? name.split('.').pop() : 'FILE';
            return extension.slice(0, 4).toUpperCase();
        }

        function addFileRow(file) {
            const row = document.createElement('div');
            row.className = 'file-row';

            const glyph = document.createElement('span');
            glyph.className = 'file-glyph';
            glyph.textContent = extensionLabel(file.name);

            const meta = document.createElement('div');
            meta.className = 'file-meta';
            const name = document.createElement('div');
            name.className = 'file-name';
            name.textContent = file.name;
            const size = document.createElement('div');
            size.className = 'file-size';
            size.textContent = formatBytes(file.size);
            meta.append(name, size);

            const actions = document.createElement('div');
            actions.className = 'file-actions';
            const download = document.createElement('button');
            download.className = 'icon-button';
            download.type = 'button';
            download.title = '下载';
            download.setAttribute('aria-label', `下载 ${file.name}`);
            download.textContent = '↓';
            const remove = document.createElement('button');
            remove.className = 'icon-button delete';
            remove.type = 'button';
            remove.title = '删除';
            remove.setAttribute('aria-label', `删除 ${file.name}`);
            remove.textContent = '×';
            actions.append(download, remove);

            row.append(glyph, meta, actions);
            fileList.prepend(row);
        }

        function simulateUpload(files) {
            if (!files.length) return;
            let progress = 0;
            progressFill.style.width = '0%';
            const timer = setInterval(() => {
                progress += 8 + Math.random() * 13;
                progressFill.style.width = `${Math.min(progress, 100)}%`;
                if (progress >= 100) {
                    clearInterval(timer);
                    [...files].reverse().forEach(addFileRow);
                    showToast(`已加入 ${files.length} 个文件`);
                    setTimeout(() => { progressFill.style.width = '0%'; }, 700);
                }
            }, 110);
        }

        fileInput.addEventListener('change', () => {
            simulateUpload(fileInput.files);
            fileInput.value = '';
        });

        ['dragenter', 'dragover'].forEach(type => {
            dropZone.addEventListener(type, event => {
                event.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(type => {
            dropZone.addEventListener(type, event => {
                event.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', event => simulateUpload(event.dataTransfer.files));

        fileList.addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;
            const row = button.closest('.file-row');
            const name = row.querySelector('.file-name').textContent;
            if (button.classList.contains('delete')) {
                row.animate(
                    [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: 'translateX(12px)' }],
                    { duration: 260, easing: 'ease', fill: 'forwards' }
                ).finished.then(() => row.remove());
                showToast(`已移除 ${name}`);
            } else {
                showToast(`演示下载：${name}`);
            }
        });

        const remembered = localStorage.getItem(STORAGE_USER);
        if (remembered) {
            usernameInput.value = remembered;
            rememberUser.checked = true;
        }
        setView('login');
    </script>
</body>
</html>
